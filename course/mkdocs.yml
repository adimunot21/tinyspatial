# mkdocs-material config for the tinyspatial course.
# Build/serve from the repo root:  mkdocs serve -f course/mkdocs.yml
site_name: tinyspatial course
site_description: Learn rigid-body kinematics and dynamics by reading a real C++ library.
site_url: https://adimunot21.github.io/tinyspatial/
repo_url: https://github.com/adimunot21/tinyspatial
repo_name: adimunot21/tinyspatial
edit_uri: edit/main/course/

# The course markdown lives alongside this config, so the docs root is here.
# site_dir must live OUTSIDE docs_dir; we build into the (gitignored) build/.
docs_dir: .
site_dir: ../build/course_site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  # MathJax-style inline/block math (CLAUDE.md / course rules use $...$).
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Only published pages are listed. New chapters get added here as they land.
nav:
  - Home: README.md
  - "0 · Welcome":
      - Overview: 00_welcome/README.md
      - What is a robot?: 00_welcome/01_what_is_a_robot.md
      - Set up your machine: 00_welcome/02_setup_your_machine.md
  - "3 · Rotations & transforms":
      - Overview: 03_rotations_and_transforms/README.md
      - What is a rotation?: 03_rotations_and_transforms/01_what_is_a_rotation.md
      - Rotation matrices: 03_rotations_and_transforms/02_rotation_matrices.md
      - Axis–angle: 03_rotations_and_transforms/03_axis_angle.md
      - Quaternions: 03_rotations_and_transforms/04_quaternions.md
      - Rigid transforms: 03_rotations_and_transforms/05_rigid_transforms.md
      - Exercises: 03_rotations_and_transforms/exercises.md
  - "4 · Lie groups":
      - Overview: 04_lie_groups/README.md
      - The manifold idea: 04_lie_groups/01_the_manifold_idea.md
      - The tangent space: 04_lie_groups/02_tangent_space.md
      - exp and log: 04_lie_groups/03_exp_and_log.md
      - Jacobians: 04_lie_groups/04_jacobians.md
      - The adjoint: 04_lie_groups/05_the_adjoint.md
      - Why robots need this: 04_lie_groups/06_why_robots_need_this.md
      - Exercises: 04_lie_groups/exercises.md
  - "5 · Spatial algebra":
      - Overview: 05_spatial_algebra/README.md
      - Why six-vectors?: 05_spatial_algebra/01_why_six_vectors.md
      - Twists and wrenches: 05_spatial_algebra/02_twists_and_wrenches.md
      - The Plücker transform: 05_spatial_algebra/03_plucker.md
      - Spatial inertia: 05_spatial_algebra/04_spatial_inertia.md
      - How Featherstone thinks: 05_spatial_algebra/05_how_featherstone_thinks.md
      - Exercises: 05_spatial_algebra/exercises.md
  - "6 · Kinematic trees":
      - Overview: 06_kinematic_trees/README.md
      - Links and joints: 06_kinematic_trees/01_links_and_joints.md
      - The tree: 06_kinematic_trees/02_the_tree.md
      - Joint variants: 06_kinematic_trees/03_joint_variants.md
      - Model and Data: 06_kinematic_trees/04_model_and_data.md
      - Exercises: 06_kinematic_trees/exercises.md
  - "7 · URDF robot models":
      - Overview: 07_urdf_robot_models/README.md
      - XML basics: 07_urdf_robot_models/01_xml_basics.md
      - URDF tags: 07_urdf_robot_models/02_urdf_tags.md
      - Inertias: 07_urdf_robot_models/03_inertias.md
      - The loader: 07_urdf_robot_models/04_the_loader.md
      - Exploring the robots: 07_urdf_robot_models/05_exploring_the_robots.md
      - Exercises: 07_urdf_robot_models/exercises.md

# Don't fail the local build over not-yet-written cross-links between chapters.
validation:
  links:
    absolute_links: ignore
    unrecognized_links: ignore
