# Builds the mkdocs-material course site and deploys to GitHub Pages.
# Triggers on every push to main (so the live site tracks main automatically)
# and can be re-run manually via the Actions UI.
#
# The site also ships a live WebAssembly widget (the interactive demo), so this
# workflow compiles the WASM module with Emscripten and drops it, plus the demo
# pages, into the built site under assets/wasm-demo/. Chapter 17 embeds it.
#
# One-time setup (repo settings, not handled by this workflow):
#   Settings → Pages → Source: "GitHub Actions"
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'course/**'
      - 'mkdocs.yml'
      - 'web/**'
      - 'src/web/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# GitHub Pages needs id-token and pages write permissions for the deploy step.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one in-flight deploy per environment; queue rather than cancel so
# in-progress deploys finish cleanly.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mkdocs
        run: pip install 'mkdocs' 'mkdocs-material' 'pymdown-extensions'

      - name: Install Emscripten (pinned)
        run: |
          git clone --depth 1 --branch 3.1.61 https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 3.1.61
          ./emsdk activate 3.1.61

      - name: Build the WASM module
        run: |
          source emsdk/emsdk_env.sh
          cmake --preset=wasm
          cmake --build build/wasm -j

      - name: Build site
        run: mkdocs build --strict

      - name: Bundle the live WASM demo into the site
        run: |
          dest=build/course_site/assets/wasm-demo
          mkdir -p "$dest"
          cp web/demo/*.html web/demo/*.js "$dest"/
          cp build/wasm/tinyspatial.js build/wasm/tinyspatial.wasm "$dest"/
          ls -lh "$dest"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/course_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
