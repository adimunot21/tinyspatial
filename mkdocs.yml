# Chapters cross-reference source files outside docs_dir (e.g.
# `../../include/tinyspatial/...`). Those resolve correctly on GitHub when
# rendered from main, but mkdocs treats them as broken internal links. Ignore.
validation:
  links:
    absolute_links: ignore
    unrecognized_links: ignore
    not_found: ignore
