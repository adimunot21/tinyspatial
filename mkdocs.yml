# mkdocs-material config for the tinyspatial course.
# Build/serve from the repo root:  mkdocs serve
# The docs workflow (.github/workflows/docs.yml) builds and deploys this to
# GitHub Pages on every push to main.
site_name: tinyspatial course
site_description: Learn rigid-body kinematics and dynamics by reading a real C++ library.
site_url: https://adimunot21.github.io/tinyspatial/
repo_url: https://github.com/adimunot21/tinyspatial
repo_name: adimunot21/tinyspatial
edit_uri: edit/main/course/

# Course chapter markdown lives under ./course; site builds into ./build.
docs_dir: course
site_dir: build/course_site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  # MathJax-style inline/block math (CLAUDE.md / course rules use $...$).
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

